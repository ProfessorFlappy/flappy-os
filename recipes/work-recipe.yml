---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: flappy-os
# description will be included in the image's metadata
description: This is my personal OS image for work.

base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      files:
        - https://repo.librewolf.net/librewolf.repo
    install:
      packages:
        - librewolf
        - syncthing # Remember to enable the service
        - lm_sensors
        - fish
    remove:
      packages:
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
        - gnome-software
        - gnome-system-monitor
        - gnome-tour
        - yelp
        - malcontent-control
        - nvtop
        - htop
        
  - type: rpm-ostree
    repos:
      - netbird.repo
    install:
      - netbird # Remember to run 'sudo netbird service install' then enable the service
  
  - type: default-flatpaks
    configurations:
      - notify: false # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.gnome.Extensions
          - org.gnome.SimpleScan
          - org.gnome.Calculator
          - org.gnome.gitlab.somas.Apostrophe
          - org.gnome.Papers
          - org.gnome.Showtime
          - org.gnome.Decibels
          - io.github.shonebinu.Brief
          - io.missioncenter.MissionCenter
          - io.github.kolunmi.Bazaar
          - com.github.tchx84.Flatseal
          - org.pvermeer.WebAppHub
          - org.cockpit_project.CockpitClient
          - io.github.totoshko88.RustConn
          - com.github.flxzt.rnote
          - com.discordapp.Discord
          
  - type: gnome-extensions
    install:
      - AppIndicator and KStatusNotifierItem Support
    uninstall:
      - Background Logo
  
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
